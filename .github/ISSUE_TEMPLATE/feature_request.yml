name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem your suggestion would solve and who would benefit.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Explain the user need or problem.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Explain how you expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches you have considered.
    validations:
      required: false

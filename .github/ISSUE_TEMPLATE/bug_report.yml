name: Bug report
description: Report a reproducible problem in the application.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check whether this issue has already been reported.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, and any relevant API setup.
    validations:
      required: false

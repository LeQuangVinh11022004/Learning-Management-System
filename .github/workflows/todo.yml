name: Auto Generate Issues from TODOs

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  todo-to-issue:
    name: Scan and Create Issues from TODOs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Issues from TODO
        uses: alstr/todo-to-issue-action@v5
        with:
          CLOSE_ISSUES: true
